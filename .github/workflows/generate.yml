name: 📝 Daily Article Generator

on:
  schedule:
    # Runs at 00:30 UTC daily (6:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write

env:
  # All secrets are configured in GitHub Settings → Secrets → Actions
  llm__api_key: ${{ secrets.LLM_API_KEY }}
  r2__account_id: ${{ secrets.R2_ACCOUNT_ID }}
  r2__access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
  r2__secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  r2__bucket_name: ${{ secrets.R2_BUCKET_NAME }}
  content__tavily_api_key: ${{ secrets.TAVILY_API_KEY }}
  content__guardian_api_key: ${{ secrets.GUARDIAN_API_KEY }}
  content__unsplash_api_key: ${{ secrets.UNSPLASH_API_KEY }}
  OPIK_API_KEY: ${{ secrets.OPIK_API_KEY }}
  OPIK_PROJECT_NAME: blogboard
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  generate-article:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v4

      - name: 🔧 Install dependencies
        run: uv sync

      - name: 📝 Generate tutorial article
        run: uv run python -m blogboard.run

      - name: 📰 Generate AI news article
        run: uv run python -m blogboard.run --ainews

      - name: 📥 Download articles from R2 to local
        run: |
          for cat in ml dl nlp cv genai ainews statistics; do
            url="https://pub-e5fe2ead9ea34b81b4020414cec48403.r2.dev/blogs/${cat}/articles.json"
            dest="blogboard/web/blogs/${cat}/articles.json"
            mkdir -p "blogboard/web/blogs/${cat}"
            curl -sf "$url" -o "$dest" 2>/dev/null || echo "[]" > "$dest"
            
            # Download each article's .md file listed in articles.json
            if [ -f "$dest" ] && [ "$(cat "$dest")" != "[]" ]; then
              for file in $(python3 -c "import json; data=json.load(open('$dest')); [print(a['file']) for a in data]" 2>/dev/null); do
                md_url="https://pub-e5fe2ead9ea34b81b4020414cec48403.r2.dev/${file}"
                curl -sf "$md_url" -o "blogboard/web/${file}" 2>/dev/null || true
              done
            fi
          done

      - name: 🚀 Commit and push new articles
        run: |
          git config user.name "BlogBoard Bot"
          git config user.email "bot@blogboard.dev"
          git add blogboard/web/blogs/
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "📝 Auto-generated articles for $(date -u +%Y-%m-%d)"
            git push
          fi
